# pre-commit 钩子：提交前自动执行 Ruff 检查与格式化、mypy 类型检查。
# 安装：make precommit-install；手动全量执行：make precommit
# Ruff 经 scripts/lint_ruff.py 执行（python 读文件后经 stdin 交给 ruff），以兼容本机透明加密（DLP）
# 环境；无 DLP 的机器行为与直接运行 ruff 一致。mypy 使用 .venv 内的可执行文件，与 make lint、CI 一致。
# gitleaks 的官方 hook 需要本机编译 Go 源码，在 DLP 环境下无法完成，因此放在 CI 的 secrets job 执行；
# 本机如需手动扫描：pre-commit run --hook-stage manual gitleaks。
repos:
  - repo: local
    hooks:
      - id: no-ciphertext                 # 本机透明加密：暂存区出现密文时用明文重新暂存并中止提交
        name: no ciphertext in index
        entry: python3 scripts/check_no_ciphertext.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check                    # 等价于 ruff check --fix（全仓）
        name: ruff check
        entry: python3 scripts/lint_ruff.py --fix
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format                   # 等价于 ruff format --check（全仓）
        name: ruff format --check
        entry: python3 scripts/lint_ruff.py --format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy                          # 与 make lint 一致：始终检查固定目录
        name: mypy
        entry: .venv/bin/mypy packages/contract/src services/runtime/src harness-adapters/claude-sdk/src
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1                          # 固定版本
    hooks:
      - id: gitleaks
        stages: [manual]                  # 本机 DLP 环境无法编译；CI 的 secrets job 负责强制扫描
