[project]
name = "ai-policy"
version = "0.1.0"
description = "Authorization decision service: Cedar engine sidecar (policy-as-code) behind POST /authz/check and /authz/check-batch"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
