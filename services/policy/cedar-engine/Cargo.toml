[package]
name = "cedar-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Cedar 授权判定 sidecar：批量判定、策略热加载、失败关闭"

[dependencies]
cedar-policy = "=4.13.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
