# LiteLLM Proxy 配置：平台统一模型出口（默认端口 4000）。
# 别名规范见 ADR-0006：<family>-<yyyy-mm>；Agent 发布快照锁定别名，模型升级 = 新增别名 + 灰度切换。
# 所有密钥通过环境变量注入（os.environ/...），生产由 Vault 下发。

model_list:
  - model_name: default-chat            # 平台默认别名（Agent 未指定时使用）
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-2026-06   # 版本锁定别名：升级模型时新增别名而不是改这里
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: deepseek-v4-pro-2026-08 # 国产模型别名，同时作为 default-chat 的回退
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: embed-default           # 向量化模型（知识检索）
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
  - model_name: rerank-default          # 重排模型（混合检索后精排）
    litellm_params:
      model: cohere/rerank-v3.5
      api_key: os.environ/COHERE_API_KEY

router_settings:
  routing_strategy: simple-shuffle      # 同别名多部署时随机分流
  fallbacks:                            # 主模型失败时的回退链
    - { default-chat: ["deepseek-v4-pro-2026-08"] }
  allowed_fails: 3                      # 连续失败 3 次后进入冷却
  cooldown_time: 60                     # 冷却秒数

litellm_settings:
  drop_params: true                     # 丢弃目标模型不支持的参数而不是报错
  # 响应缓存关闭（S4，D70）：Agent 场景下完全相同的请求会被回放旧回答与旧用量，连同其中的工具调用（指向其他 Run 的
  # 工件引用）一起回放，造成错误结果与计费失真；厂商侧的 Prompt Cache 不受影响。需要时只对无工具的只读场景单独开启。
  cache: false
  cache_params: { type: redis, host: os.environ/REDIS_HOST, port: 6379 }
  success_callback: ["langfuse"]        # 调用成功后把 Trace 回调到 Langfuse（ADR-0002）
  # 回调只记元数据（模型、用量、耗时、metadata 中的 run_id 等），不记消息正文与回答（S6）：网关看不到 Run 的机密污点
  # （D65④，平台侧 Trace 按污点脱敏，网关侧无从判断），且图片附件以 base64 data URL 发给模型，记正文会把整张图写进
  # Langfuse。正文的权威记录是平台事件日志与平台侧 Trace。
  turn_off_message_logging: true

# 进程环境变量（LiteLLM 启动时写入 os.environ）。LANGFUSE_HOST 未设置时 Langfuse 回调默认发往 https://cloud.langfuse.com
# ——数据出境（S6 排查发现：本机此前一直在向该地址导出并被 401 拒绝）。这里固定为 compose 内的 Langfuse；
# 其他部署以各自的配置文件覆盖。回调密钥只经环境变量（LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY）注入，不写在这里。
environment_variables:
  LANGFUSE_HOST: http://langfuse-web:3000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY        # 管理密钥；业务侧使用虚拟 Key
  database_url: os.environ/LITELLM_DATABASE_URL    # 虚拟 Key、预算与 spend 表的存储
  max_budget: 10000                     # 全局月预算（单位随计费货币）
  budget_duration: 30d                  # 预算周期
