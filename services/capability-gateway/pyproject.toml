[project]
name = "ai-capability-gateway"
version = "0.1.0"
description = "Capability registry, two-level discovery, authz proxy, token exchange, MCP connectors, Skill store"
requires-python = ">=3.11"
dependencies = ["ai-contract", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
mcp = ["mcp>=1.0"]
search = ["elasticsearch>=8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
