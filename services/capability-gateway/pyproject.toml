[project]
name = "ai-capability-gateway"
version = "0.1.0"
description = "Capability registry, two-level discovery, authz proxy, token exchange, MCP connectors, Skill store"
requires-python = ">=3.11"
dependencies = [
  "ai-contract",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "sqlalchemy[asyncio]>=2.0",                 # 目录库（S8.1）
  "alembic>=1.13",                            # 网关自带迁移（version_table cg_alembic_version）
  "pyjwt[crypto]>=2.10",                      # 服务令牌 / 用户令牌 JWKS 验签、act 断言 ES256 签名（S8.4）
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "schemathesis>=3.30", "aiosqlite>=0.20"]
mcp = ["mcp>=1.0"]
mysql = ["asyncmy>=0.2.9"]                    # CATALOG_BACKEND=mysql
fastembed = ["fastembed>=0.4"]                # EMBED_PROVIDER=fastembed（本机 bge-small-zh-v1.5）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
