# 能力网关目录库的 Alembic 配置（命令行入口：在 services/capability-gateway 目录下执行 alembic ...）。
# 连接串不写死：env.py 读取 GATEWAY_DATABASE_URL，也可 `alembic -x db_url=mysql+asyncmy://... upgrade head`。
# 版本表为 cg_alembic_version（见 env.py），可与其他服务共用一个库。

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
