# Runtime 引擎库的 Alembic 配置（命令行入口：在 services/runtime 目录下执行 alembic ...，或用 make migrate）。
# 连接串不写死在这里：env.py 默认读取 runtime.config.settings.database_url（即环境变量 DATABASE_URL），
# 也可用 `alembic -x db_url=mysql+asyncmy://... upgrade head` 临时指定。

[alembic]
# 迁移脚本目录（相对本文件所在目录）
script_location = %(here)s/migrations
# 迁移文件名模板：0001_initial.py 这种"版本号_描述"的形式
file_template = %%(rev)s_%%(slug)s
# 多路径分隔符使用操作系统默认值
path_separator = os
# 迁移文件中时间戳使用 UTC
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
