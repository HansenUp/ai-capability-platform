[project]
name = "ai-runtime"
version = "0.1.0"
description = "Agent Runtime node: Messages/Run API, event log, context budget, guard, harness loading"
requires-python = ">=3.11"
dependencies = [
  "ai-contract",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.0",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.6",
  "alembic>=1.13",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "pyjwt[crypto]>=2.10",
  "redis>=5",                                 # Run 队列（Redis Streams）与跨节点取消（pub/sub），S7
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy", "schemathesis>=3.30", "fakeredis>=2.20"]
mysql = ["asyncmy>=0.2"]
claude = ["ai-harness-claude-sdk[sdk]"]
probe = ["ai-harness-probe"]                 # 契约探针工厂（runtime.harness.mock 的脚本模式 / 门禁）

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
