[project]
name = "ai-runtime"
version = "0.1.0"
description = "Agent Runtime node: Messages/Run API, event log, context budget, guard, harness loading"
requires-python = ">=3.11"
dependencies = [
  "ai-contract",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.0",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy", "schemathesis>=3.30"]
mysql = ["asyncmy>=0.2"]
claude = ["ai-harness-claude-sdk"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
