[project]
name = "ai-console-api"
version = "0.1.0"
description = "Agent Console backend: tenants/roles/assignment, agent lifecycle + eval gate, node control plane, routing table"
requires-python = ">=3.11"
dependencies = [
  "ai-contract",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.10",                      # 节点服务令牌（ai-node-svc）验签，S9.8
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
mysql = ["asyncmy>=0.2"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
