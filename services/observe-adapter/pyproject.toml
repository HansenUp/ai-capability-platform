[project]
name = "ai-observe-adapter"
version = "0.1.0"
description = "Open reporting API for third-party agents + feedback → OTLP / Langfuse"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
langfuse = ["langfuse>=3"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
