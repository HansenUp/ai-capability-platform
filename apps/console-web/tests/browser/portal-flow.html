<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Isolated Portal flow</title></head><body>
<label>合成身份<select id="actor" aria-label="合成身份"><option>alice</option><option>alice_fresh</option><option>bob</option><option>foreign</option></select></label>
<div id="component"></div><script type="module">
import { createApp, h } from "vue";
import { createRouter, createMemoryHistory, RouterView } from "vue-router";
import AgentList from "../../../portal-web/src/views/AgentList.vue";
import Tasks from "../../../portal-web/src/views/Tasks.vue";
import Chat from "../../../portal-web/src/views/Chat.vue";
import { portalTokenKey } from "../../../portal-web/src/runtime-session.ts";
const tokens = await (await fetch('/synthetic-tokens')).json();
const router = createRouter({ history: createMemoryHistory(), routes: [
  { path: "/tasks", component: Tasks },
  { path: '/', component: AgentList }, { path: '/chat/:agentId', component: Chat },
] });
const app = createApp({ render: () => h(RouterView) });
app.provide(portalTokenKey, async () => tokens[document.querySelector('#actor').value]);
app.use(router).mount('#component');
</script></body></html>
