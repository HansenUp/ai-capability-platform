<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Portal adapter fixture</title></head><body>
<button id="unmount">卸载测试组件</button><div id="component"></div>
<script type="module">
import { createApp, h } from "vue";
import Chat from "../../src/views/Chat.vue";
// Explicit synthetic provider, independent of real IdP/sessionStorage.
let count = 0;
const app = createApp(Chat, { portalAgent: "synthetic-agent", portalTokenProvider: async () => `synthetic-${++count}` });
app.component("RouterLink", { props: ["to"], setup(props, { slots }) { return () => h("a", { href: props.to }, slots.default?.()); } });
app.mount("#component");
document.querySelector("#unmount").addEventListener("click", () => app.unmount());
</script></body></html>
