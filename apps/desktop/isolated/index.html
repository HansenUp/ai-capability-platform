<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面隔离宿主</title>
<style>body{font:16px system-ui;background:#f2f5fa;color:#17253a;margin:0}main{max-width:900px;margin:40px auto;padding:24px}section{background:white;border:1px solid #dbe2ed;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:30px}button,input,select{font:inherit;padding:10px;margin:5px;min-height:44px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2563eb}#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#edf5ff}small{color:#53647a} [role=alert]{color:#a32724}@media(max-width:600px){main{margin:0;padding:16px}label{display:block}}</style>
<main><h1>桌面隔离宿主</h1><p>纯替身 · 无真实 sidecar 进程 · 无业务写入 · 无自动更新</p>
<section><h2>1. 生命周期</h2><p>Sidecar：<strong id="state">STOPPED</strong></p><label>故障模拟 <select id="fault"><option value="none">正常</option><option value="start">启动失败</option><option value="stop">清理结果未知</option><option value="read">读取失败</option><option value="hold-start">暂挂启动</option><option value="hold-read">暂挂读取</option><option value="hold-read-error">暂挂读取后失败</option></select></label><button id="start">启动替身</button><button id="stop">停止替身</button><p id="lifecycle-note"></p><button id="release" disabled>释放暂挂替身</button><p id="pending">无暂挂操作</p></section>
<section><h2>关闭意图与只读核对 · 替身</h2><button id="close-intent">请求关闭宿主</button><label>退出证据模拟 <select id="proof"><option value="absent">尚无证据</option><option value="foreign">其他句柄</option><option value="alive">仍在运行</option><option value="matched">本次句柄已退出</option></select></label><button id="reconcile" disabled>只读核对退出证据</button><p id="close-state">未请求关闭</p><p id="calls">停止调用：0 · 核对调用：0</p><small>此按钮仅模拟关闭协议，不关闭真实窗口或进程。浏览器强退不能保证原生清理。</small></section>
<section><h2>2. 测试身份与连接</h2><label>测试身份 <select id="identity"><option>alice</option><option>bob</option></select></label><label>有效期（秒）<input id="ttl" type="number" min="1" max="300" value="60"></label><button id="login">应用身份</button><button id="logout">注销</button><p id="identity-status">未认证</p><button id="network">模拟断网</button><p id="connection">在线替身</p></section>
<section><h2>3. 已授权合成缓存</h2><p>断网仅可读取本次身份已缓存的合成内容；重载不保留。身份到期、切换或停止立即清空展示。</p><button id="read">读取合成摘要</button><button disabled>业务写入（禁止）</button><div id="result" hidden></div><p id="empty">暂无可展示缓存</p><p id="error" role="alert"></p></section></main><script type="module" src="./host.mjs"></script></html>
