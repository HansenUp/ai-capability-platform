# CI：push / PR 时并行执行 Python 与前端两条流水线。
name: ci
on: [push, pull_request]
jobs:
  python:                                 # Python：安装全部包 → ruff 静态检查 → OpenAPI 一致性 → pytest（含契约测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup CLAUDE_SDK_EXTRAS=dev,sdk   # 一次性安装全部本地包；test_probe_gate 要求 claude-sdk 探针工厂可导入（需 SDK）
      - run: .venv/bin/ruff check .
      - run: make openapi-check             # docs/api 下的 OpenAPI 必须与代码一致
      - run: .venv/bin/python -m pytest -q
  failover:                               # S7 进程级故障注入：API×1 + Worker×2 子进程，kill -9 持租约 Worker 后 60 s 内接管完成
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      FAILOVER_REDIS_URL: redis://localhost:6379/14
      FAILOVER_DATABASE_URL: mysql+asyncmy://root:root@localhost:3306/ai_runtime_failover_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup RUNTIME_EXTRAS=dev,probe,mysql   # asyncmy：进程级用例的 API / Worker 子进程连 MySQL
      - run: .venv/bin/python -c "import asyncmy"
      - run: .venv/bin/python -m pytest services/runtime/tests/test_failover.py -m failover -q -s
  probes:                                 # 契约探针上架门禁（S5 / D86）：KNOWN 中每个 harness 五项探针全过、声明能力不高于探针验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup CLAUDE_SDK_EXTRAS=dev,sdk   # 进程内探针：真实 SDK + 脚本化 Transport，不需要 CLI 与模型 Key
      # 不下载 goose / dsh 等第三方二进制（S6）：门禁对它们记 unavailable；ACP 桥由 fake ACP agent 过五项探针。
      # 真实二进制的门禁在本机执行（make probe-real），报告按二进制版本存档。
      - run: make probe
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-report, path: "probe-report*.json", if-no-files-found: warn }
  web:                                    # 前端：pnpm 工作区安装 → 构建 sdk-web / portal-web / console-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile || pnpm install   # lockfile 不一致时退回普通安装
      - run: pnpm -r build
  images:                                 # 镜像：5 个服务逐个构建（不推送）并用 Trivy 扫描 CRITICAL / HIGH 漏洞
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [runtime, console-api, capability-gateway, policy, observe-adapter]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/${{ matrix.service }}/Dockerfile -t ai-platform/${{ matrix.service }}:ci .
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ai-platform/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true            # 仅关注已有修复版本的漏洞，避免基础镜像无补丁项造成噪声
  secrets:                                # 密钥扫描：gitleaks 全历史扫描（本机 DLP 环境无法编译 hook，故在 CI 强制）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
