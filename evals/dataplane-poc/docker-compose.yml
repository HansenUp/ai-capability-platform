# 数据面 POC（ADR-0005）：上游 MCP Server、策略服务与三个数据面候选（自研 / agentgateway / ContextForge）。
# 由 poc.py 驱动（`python evals/dataplane-poc/poc.py up`）：先把仓库源码打成镜像（本机 .py 透明加密，不能直接挂载），再起本文件。
# 依赖 deploy/compose-dev 已在运行的 Keycloak（宿主机 8180）与 OTel Collector（宿主机 4318 → Langfuse），本文件不碰它们；
# 候选的 Span 先到本文件的 otel 服务，由它决定丢弃（压测）还是转发到 compose-dev（功能用例）。
# 端口一律只绑宿主机 127.0.0.1。基线与候选走同一网络路径：宿主机压测器 → Docker 端口转发 →（候选网关 →）upstream 容器。
# 资源：每个数据面候选 2 CPU / 2 GiB，上游与策略服务各 2 CPU，避免互相争抢造成偏差。
name: dataplane-poc

x-py: &py
  image: ai-platform/dataplane-poc-py:local   # FROM ghcr.io/ibm/mcp-context-forge:v1.0.11（借用其 Python 3.12 运行时，免拉额外基础镜像）
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: "no"
  healthcheck: { disable: true }              # 基础镜像自带的 ContextForge 健康检查不适用于这些服务

services:
  otel:                                       # POC 的 Span 汇聚点（见 otel-collector.yaml；镜像与 compose-dev 相同，本机已有）
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    environment: { POC_TRACE_EXPORTER: "${POC_TRACE_EXPORTER:-debug}" }
    extra_hosts: ["host.docker.internal:host-gateway"]
    cpus: 1

  upstream:                                   # 上游 MCP Server（streamable-http，有状态会话，单进程）
    <<: *py
    command: ["uvicorn", "upstream:app", "--host", "0.0.0.0", "--port", "9100", "--no-access-log", "--log-level", "warning"]
    working_dir: /poc/evals
    environment:
      UPSTREAM_JWKS_URL: http://host.docker.internal:8180/realms/ai-platform/protocol/openid-connect/certs
      UPSTREAM_ISSUER: http://localhost:8180/realms/ai-platform   # 令牌由宿主机 localhost:8180 签发
      UPSTREAM_AUDIENCE: mcp-ticket
    ports: ["127.0.0.1:19100:9100"]
    cpus: 2

  policy:                                     # 策略服务（services/policy，判定日志改为有界，见 policy_app.py）
    <<: *py
    command: ["uvicorn", "policy_app:app", "--host", "0.0.0.0", "--port", "8083", "--workers", "2", "--no-access-log", "--log-level", "warning"]
    working_dir: /poc/evals
    ports: ["127.0.0.1:19083:8083"]
    cpus: 2

  selfbuilt:                                  # 判定端点 /authz/mcp-check（capability-gateway，供另两个候选回调）；自研数据面 mcp_proxy 已于 S9 删除（D153），历史结果见 results/
    <<: *py
    # relay：容器内 127.0.0.1:8180 → 宿主机 Keycloak，使换取请求的 Host 仍为 localhost:8180（签发者与用户令牌一致）
    command: ["sh", "-c", "python /poc/evals/relay.py 127.0.0.1:8180 host.docker.internal:8180 & exec uvicorn capability_gateway.main:app --host 0.0.0.0 --port 8082 --workers 2 --no-access-log --log-level warning"]
    environment:
      KEYCLOAK_TOKEN_URL: http://localhost:8180/realms/ai-platform/protocol/openid-connect/token
      GATEWAY_CLIENT_ID: capability-gateway
      GATEWAY_AUTHZ_TOKEN: poc-authz-token-dev                # /authz/mcp-check 服务间共享密钥（与 agentgateway.yaml、ContextForge 插件一致，仅 POC）
      GATEWAY_CLIENT_SECRET: capability-gateway-dev-secret   # 本机 realm 的开发密钥（services/identity/realm-export.json）
      POLICY_URL: http://policy:8083
      MCP_TICKET_URL: http://upstream:9100/mcp    # 种子登记 mcp-ticket 指向 POC 上游（受众 mcp-ticket）
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    ports: ["127.0.0.1:19200:8082"]
    cpus: 2
    mem_limit: 2g
    depends_on: [upstream, policy]

  agentgateway:                               # 候选 2：agentgateway（Apache-2.0），ext_authz 回调 selfbuilt 的 /authz/mcp-check
    image: ghcr.io/agentgateway/agentgateway:v1.6.0
    command: ["-f", "/config/agentgateway.yaml"]
    volumes: ["./agentgateway.yaml:/config/agentgateway.yaml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:19300:3000"]
    cpus: 2
    mem_limit: 2g
    depends_on: [upstream, selfbuilt]

  contextforge:                               # 候选 3：IBM ContextForge（Apache-2.0），TOOL_PRE_INVOKE 插件回调 selfbuilt 的 /authz/mcp-check
    image: ai-platform/dataplane-poc-contextforge:local   # FROM ghcr.io/ibm/mcp-context-forge:v1.0.11 + 平台判定插件
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      HOST: 0.0.0.0
      PORT: "4444"
      GUNICORN_WORKERS: "1"                   # 本机 Docker VM 内存仅 7.6 GiB（compose-dev 已占约 7 GiB），2 个 worker 会挤掉 ClickHouse
      DATABASE_URL: sqlite:////tmp/mcp.db
      CACHE_TYPE: memory
      AUTH_REQUIRED: "true"
      JWT_SECRET_KEY: poc-contextforge-jwt-secret-0123456789abcdef   # 仅本 POC 容器内有效的开发值
      AUTH_ENCRYPTION_SECRET: poc-contextforge-enc-secret-0123456789abcdef
      PLATFORM_ADMIN_EMAIL: admin@example.com
      PLATFORM_ADMIN_PASSWORD: Poc-Admin-Passw0rd!
      DEFAULT_USER_PASSWORD: Poc-User-Passw0rd!
      MCPGATEWAY_UI_ENABLED: "false"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      SECURE_COOKIES: "false"
      ENVIRONMENT: development
      SSRF_ALLOW_LOCALHOST: "true"
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      SSRF_DNS_FAIL_CLOSED: "false"
      ENABLE_HEADER_PASSTHROUGH: "true"
      ENABLE_SENSITIVE_HEADER_PASSTHROUGH: "true"
      DEFAULT_PASSTHROUGH_HEADERS: '["X-Upstream-Authorization","X-AI-Agent","X-AI-Run-Id","X-AI-Call-Id","traceparent"]'
      PLUGINS_ENABLED: "true"
      PLUGINS_CONFIG_FILE: plugins/poc-config.yaml
      OTEL_ENABLE_OBSERVABILITY: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: contextforge
      LOG_LEVEL: ERROR
      RATE_LIMITING_ENABLED: "false"          # 压测为单一账号高频调用：关闭按账号的限流与锁定，否则 429 + 锁号 15 分钟
      RATE_LIMIT_LOCKOUT_ENABLED: "false"
    ports: ["127.0.0.1:19400:4444"]
    cpus: 2
    mem_limit: 1g                             # 见 GUNICORN_WORKERS 注释：给本机其他服务留内存
    depends_on: [upstream, selfbuilt]
