# 根级 Python 工具配置。各服务 / 包各自有 pyproject.toml 声明依赖，这里只放 Ruff、mypy、pytest 的统一规则。
[project]
name = "ai-capability-platform"
version = "0.1.0"
description = "Enterprise AI capability platform monorepo"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140                        # 行宽上限
target-version = "py311"
# 让 Ruff 识别各包的 src 布局，正确判断 first-party 导入排序
src = ["packages/*/src", "services/*/src", "harness-adapters/*/src", "mcp-servers/*/src"]
# 由 OpenAPI 自动生成的 SDK 类型（scripts/gen_sdk_types.sh）不做静态检查
extend-exclude = ["packages/sdk-python/src/ai_platform_sdk/types_*.py"]

[tool.ruff.format]
quote-style = "double"                   # 与现有代码一致：字符串使用双引号
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# E/F 基础错误，I 导入排序，B 常见坑，UP 现代语法，ASYNC 异步误用，S 安全（bandit）
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]                # S101 允许测试中的 assert；B008 允许 FastAPI 的 Depends() 默认参数

[tool.ruff.lint.per-file-ignores]
"scripts/verify_s10_node_control.py" = ["S603"]
"scripts/verify_s10_routing.py" = ["S603"]
"scripts/verify_s10_publishing.py" = ["S603"]
"scripts/verify_s11_console.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"                    # async 测试无需逐个标记
testpaths = ["packages", "services", "harness-adapters", "mcp-servers", "evals"]
