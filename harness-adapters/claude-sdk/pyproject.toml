[project]
name = "ai-harness-claude-sdk"
version = "0.1.0"
description = "Harness adapter for the Claude Agent SDK (CLI subprocess over stdio; platform-executed tools via in-process MCP)"
requires-python = ">=3.11"
dependencies = ["ai-contract"]
[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.2,<0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
