[project]
name = "ai-harness-stdio"
version = "0.1.0"
description = "Sub-process stdio Harness adapter (transport mode B, NDJSON) for dsh / Goose / any CLI harness"
requires-python = ">=3.11"
dependencies = ["ai-contract", "pydantic>=2.6"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
probe = ["ai-harness-probe"]  # ai_harness_stdio.testing 的探针工厂
# ACP 桥（goose / dsh，S6 WP-A）：shim 与平台工具代理的 HTTP 服务、上游模型网关客户端
acp = ["uvicorn>=0.30", "starlette>=0.40", "httpx>=0.27"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"ai_harness_stdio.dsh" = ["cordis.patch.yml"]
